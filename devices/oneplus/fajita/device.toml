# SPDX-License-Identifier: Apache-2.0
schema = 1
vendor = "oneplus"
codename = "fajita"
name = "OnePlus 6T"
form_factor = "phone"
year = 2018
soc = "qcom/sdm845"
tier = "experimental"
maintainers = ["@adewaleafolabi"]

[kernel]
# A source lock is experimental bring-up, not a published kernel tag:
# sdm845-mainline sdm845-7.1-rc1-r0 with postmarketOS's patches and config.
source_lock = "config/kernel/oneplus-fajita-7.1-rc1.json"
release = "7.1.0-rc1-sdm845-luma"
config = "config/kernel/oneplus-fajita.config"
dtb = "qcom/sdm845-oneplus-fajita.dtb"

[boot]
config = "boot.toml"

[initramfs]
# The boot image's ramdisk is two concatenated cpio archives; the kernel
# unpacks them in order and later files replace earlier ones
# (scripts/mobile/build-fajita-boot-image.sh):
#  1: the ramdisk of the postmarketOS v26.06 OnePlus 6T boot image below
#     (postmarketos-initramfs 3.11.0-r1), unmodified.
#  2: Luma: init_functions.sh, this kernel's builds of the base ramdisk's
#     modules, the shared OSTree boot resolver (scripts/mobile/common/initramfs),
#     ostree-prepare-root with its configuration and Fedora 44 libraries from
#     the deployed commit, and the clock floor. init_functions.sh leaves /boot
#     on the root filesystem, where ostree writes the boot entries the resolver
#     reads, and serves firmware and modules from /var/lib/luma until the
#     device packages are layered (INSTALL.md).
base_boot_image = "https://images.postmarketos.org/bpo/v26.06/oneplus-fajita/phosh/20261106-0600/20261106-0600-nura-v26.06-phosh-oneplus-fajita-boot.img.xz"
base_boot_image_sha256 = "434c6316feb1b77320b7795237374faf1542b8e9d843d40b57742778be5c5a32"
ramdisk_sha256 = "f7d80d765bd658f5a3825dc30925e3689af7337ec474da7dd1a3edb42859c917"
base = "postmarketos-initramfs 3.11.0-r1"
init_functions = "scripts/mobile/fajita-init-functions.sh"
init_functions_sha256 = "3edbbedb36d4e2327937347b0cf103f6d448e5fa63bba476001059e54f18f0d1"

[firmware]
# OnePlus firmware from sdm845-mainline/firmware-oneplus-sdm845 (3e31a0c3)
# and linux-firmware, as postmarketOS packages it (firmware-oneplus-sdm845
# 14-r0; Alpine linux-firmware 20260519-r0). Names and hashes only.
manifest = "firmware.manifest"
manifest_sha256 = "baba8269982106e5f446e281675407d544e7610c428d918109e17f7031296684"
files = 35
# Installed by luma-fajita-firmware in /usr/lib/firmware
# (scripts/packages/assemble-luma-fajita-firmware.py pins the packages).
store = "/usr/lib/firmware"

[install]
guide = "INSTALL.md"
method = "fastboot"
# Partitions the install must never erase or write. modemst1/modemst2 hold the
# phone's own modem settings, including its IMEI.
preserve = ["modemst1", "modemst2", "fsg", "fsc", "persist"]

d /var/lib/luma 0755 root root -
# Android on the Adreno 630 with the hardware graphics path (gbm, mesa,
# freedreno). Written only when Android has no configuration yet; luma-android
# never rewrites an existing one (SimplyLuma/luma#286).
d /var/lib/waydroid 0755 root root -
f /var/lib/waydroid/waydroid.cfg 0644 root root - [waydroid]\n\n[properties]\nro.hardware.gralloc=gbm\nro.hardware.egl=mesa\nro.hardware.vulkan=freedreno\n
